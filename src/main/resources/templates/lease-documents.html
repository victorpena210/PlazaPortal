<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Lease documents.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>Lease documents.</h1><p class="muted">Share signed agreements securely with the tenant.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><section class="card"><h2 th:text="${lease.tenantName+' · Unit '+lease.office.officeNumber}"></h2><form th:action="@{/admin/leases/{id}/documents(id=${lease.id})}" method="post" enctype="multipart/form-data"><label for="file">Lease PDF (up to 10 MB)</label><input id="file" name="file" type="file" accept="application/pdf" required><div class="actions"><button>Upload document</button></div></form></section><section class="card"><p th:if="${#lists.isEmpty(documents)}">No documents uploaded.</p><p th:each="d:${documents}"><a th:href="@{/documents/{id}(id=${d.id})}" th:text="${d.originalName}"></a></p></section></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
