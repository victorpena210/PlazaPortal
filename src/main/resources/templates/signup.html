<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Create your owner account.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>Create your owner account.</h1><p class="muted">Start with a company. Add properties and invite your team.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><form class="card narrow" th:action="@{/signup}" method="post"><label for="companyName">Company name</label><input id="companyName" name="companyName" maxlength="150" required><label for="email">Email</label><input id="email" name="email" type="email" required><div class="form-grid"><div><label for="first">First name</label><input id="first" name="firstName" maxlength="100" autocomplete="given-name" required></div><div><label for="last">Last name</label><input id="last" name="lastName" maxlength="100" autocomplete="family-name" required></div></div><label for="password">Password</label><input id="password" name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required><p class="small muted">Use at least 12 characters.</p><div class="actions"><button>Create account</button></div></form></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
