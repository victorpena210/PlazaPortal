<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Welcome back.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>Welcome back.</h1><p class="muted">Sign in to manage your property or tenant account.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><section class="card narrow"><p class="alert error" th:if="${param.error}">Email or password was incorrect.</p><p class="alert" th:if="${param.logout}">You have signed out.</p><form th:action="@{/login}" method="post"><label for="email">Email</label><input id="email" type="email" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required><div class="actions"><button>Sign in</button><a th:href="@{/forgot-password}">Forgot password?</a></div></form></section></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
