<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Payment receipt.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>Payment receipt.</h1><p class="muted">Keep this record for your files.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><section class="card receipt"><h2 th:text="${payment.office.property.company.name}"></h2><dl><dt>Payment number</dt><dd th:text="${payment.id}"></dd><dt>Invoice</dt><dd th:text="${payment.invoice != null ? payment.invoice.id : 'Legacy payment'}"></dd><dt>Property / unit</dt><dd th:text="${payment.office.property.name+' / '+payment.office.officeNumber}"></dd><dt>Amount received</dt><dd th:text="${'$'+payment.totalAmount}"></dd><dt>Refunded</dt><dd th:text="${'$'+payment.refundedAmount}"></dd><dt>Method</dt><dd th:text="${payment.paymentMethod}"></dd><dt>Status</dt><dd th:text="${payment.status}"></dd><dt>Received</dt><dd th:text="${payment.paidAt}"></dd><dt>Reference</dt><dd th:text="${payment.transactionReference}"></dd></dl><p class="small muted">Use your browser’s Print command to save a PDF copy.</p></section></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
