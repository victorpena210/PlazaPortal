<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('You’re invited.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>You’re invited.</h1><p class="muted">Accept your invitation to get started.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><section class="card narrow"><h2 th:text="${companyName}"></h2><p>Invited email: <strong th:text="${invitedEmail}"></strong></p><p th:if="${accountExists}">Already registered? Sign in using this email, then accept the invitation.</p><a th:if="${accountExists and currentUser == null}" class="button" th:href="@{/login}">Sign in to accept</a><form th:if="${!accountExists or currentUser != null}" th:action="@{${invitePath}}" method="post"><input type="hidden" name="token" th:value="${token}"><div th:if="${!accountExists}"><div class="form-grid"><div><label for="first">First name</label><input id="first" name="firstName" maxlength="100" autocomplete="given-name" required></div><div><label for="last">Last name</label><input id="last" name="lastName" maxlength="100" autocomplete="family-name" required></div></div><label for="password">Password</label><input id="password" name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required><p class="small muted">Use at least 12 characters.</p></div><div class="actions"><button>Accept invitation</button></div></form></section></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
