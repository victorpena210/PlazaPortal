<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Company & team.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>Company & team.</h1><p class="muted">Manage access and review recent activity.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><div class="grid"><form class="card" th:action="@{/admin/company}" method="post"><h2>Company details</h2><p class="small muted">Company ID: <span th:text="${company.id}"></span></p><label for="name">Name</label><input id="name" name="name" th:value="${company.name}" maxlength="150" required><label for="supportEmail">Contact email</label><input id="supportEmail" name="supportEmail" type="email" th:value="${company.supportEmail}" required><div class="actions"><button>Save details</button><a th:href="@{/companies/new}">Add another company</a></div></form><form class="card" th:action="@{/admin/company/invite}" method="post"><h2>Invite a team member</h2><label for="email">Email</label><input id="email" name="email" type="email" required><label for="role">Access</label><select id="role" name="role"><option value="MANAGER">Manager — properties, leases and billing</option><option value="OWNER">Owner — also controls team access</option></select><div class="actions"><button>Send invitation</button></div></form></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Access</th><th>Action</th></tr></thead><tbody><tr th:each="m:${team}"><td th:text="${m.user.firstName+' '+m.user.lastName}"></td><td th:text="${m.user.email}"></td><td th:text="${m.role}"></td><td><form th:action="@{/admin/company/members/{id}/remove(id=${m.id})}" method="post"><button class="secondary">Remove access</button></form></td></tr></tbody></table></div><h2>Recent activity</h2><div class="table-wrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead><tbody><tr th:each="e:${auditEntries}"><td th:text="${e.createdAt}"></td><td th:text="${e.actor}"></td><td th:text="${#strings.replace(e.action,'_',' ')}"></td><td th:text="${e.details}"></td></tr></tbody></table></div></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
