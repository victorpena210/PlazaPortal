<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Properties & units.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>Properties & units.</h1><p class="muted">Keep every building and rentable space organized.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><div class="grid"><form class="card" th:action="@{/admin/properties}" method="post"><h2>Add a property</h2><label>Name</label><input name="name" maxlength="150" required><label>Address</label><input name="address" maxlength="500" required><label class="check"><input type="checkbox" name="active" value="true" checked> Active property</label><div class="actions"><button>Add property</button></div></form><form class="card" th:action="@{/admin/units}" method="post"><h2>Add a unit</h2><label>Property</label><select name="propertyId" required><option th:each="p:${properties}" th:value="${p.id}" th:text="${p.name}"></option></select><div class="form-grid"><div><label>Unit number</label><input name="officeNumber" maxlength="20" required></div><div><label>Square feet</label><input name="squareFeet" type="number" min="1"></div></div><label>Description</label><input name="description" maxlength="255"><label>Availability</label><select name="status"><option value="AVAILABLE">Available</option><option value="MAINTENANCE">Under maintenance</option></select><div class="actions"><button th:disabled="${#lists.isEmpty(properties)}">Add unit</button></div></form></div><div class="grid"><section class="card" th:each="p:${properties}"><h2 th:text="${p.name}"></h2><p th:text="${p.address}"></p><span class="badge" th:text="${p.active?'Active':'Inactive'}"></span><details><summary>Edit property</summary><form th:action="@{/admin/properties}" method="post"><input type="hidden" name="id" th:value="${p.id}"><label>Name</label><input name="name" th:value="${p.name}" maxlength="150" required><label>Address</label><input name="address" th:value="${p.address}" maxlength="500" required><label class="check"><input type="checkbox" name="active" value="true" th:checked="${p.active}"> Active</label><div class="actions"><button>Save</button></div></form></details></section></div><h2>Your units</h2><div class="table-wrap"><table><thead><tr><th>Property</th><th>Unit</th><th>Status</th><th>Edit</th></tr></thead><tbody><tr th:each="u:${units}"><td th:text="${u.property.name}"></td><td th:text="${u.officeNumber}"></td><td th:text="${u.status}"></td><td><details><summary>Edit unit</summary><form th:action="@{/admin/units}" method="post"><input type="hidden" name="id" th:value="${u.id}"><input type="hidden" name="propertyId" th:value="${u.property.id}"><label>Unit number</label><input name="officeNumber" th:value="${u.officeNumber}" maxlength="20" required><label>Square feet</label><input name="squareFeet" type="number" min="1" th:value="${u.squareFeet}"><label>Description</label><input name="description" maxlength="255" th:value="${u.description}"><label>Availability when unoccupied</label><select name="status"><option value="AVAILABLE">Available</option><option value="MAINTENANCE" th:selected="${u.status.name()=='MAINTENANCE'}">Under maintenance</option></select><div class="actions"><button>Save unit</button></div></form></details></td></tr></tbody></table></div></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
