name: Test PlazaPortal
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: plaza_test
          MYSQL_USER: plaza
          MYSQL_PASSWORD: testpassword
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestroot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test
      - run: ./mvnw -B -Dtest=MigrationTest test
        env:
          MIGRATION_TEST_URL: jdbc:mysql://localhost:3306/plaza_test
          MIGRATION_TEST_USER: plaza
          MIGRATION_TEST_PASSWORD: testpassword
