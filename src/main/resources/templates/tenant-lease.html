<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Your leases & documents.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>Your leases & documents.</h1><p class="muted">Review your agreements and download documents.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><section class="card" th:each="l:${leases}"><h2 th:text="${l.office.property.name+' · Unit '+l.office.officeNumber}"></h2><dl><dt>Tenant</dt><dd th:text="${l.tenantName}"></dd><dt>Monthly rent</dt><dd th:text="${'$'+l.monthlyRent}"></dd><dt>Dates</dt><dd th:text="${l.startDate+' to '+l.endDate}"></dd><dt>Monthly due day</dt><dd th:text="${l.dueDay}"></dd></dl><h3>Documents</h3><p th:each="d:${documents.findByLeaseIdOrderByCreatedAtDesc(l.id)}"><a th:href="@{/documents/{id}(id=${d.id})}" th:text="${d.originalName}"></a></p></section><p class="card muted" th:if="${#lists.isEmpty(leases)}">No leases are linked to your account.</p></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
