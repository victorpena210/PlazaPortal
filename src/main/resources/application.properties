spring.application.name=PlazaPortal
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pena_plaza?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:plazaportal}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.time-zone=${APP_TIME_ZONE:America/Chicago}
app.owner-signup-enabled=${OWNER_SIGNUP_ENABLED:false}
app.bootstrap-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.mail-enabled=${MAIL_ENABLED:false}
app.mail-from=${MAIL_FROM:}
app.jobs-enabled=${JOBS_ENABLED:true}
app.upload-dir=${UPLOAD_DIR:./data/uploads}
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.company-accounts=${STRIPE_COMPANY_ACCOUNTS:}
stripe.live-mode=${STRIPE_LIVE_MODE:false}
stripe.integration-identifier=${STRIPE_INTEGRATION_IDENTIFIER:plazaportal-rent-qarvnbtk}
