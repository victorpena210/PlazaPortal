<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Your payments.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>Your payments.</h1><p class="muted">Payment history and receipts for your account.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Amount</th><th>Method</th><th>Status</th><th>Details</th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="${p.createdAt}"></td><td th:text="${p.invoice != null ? '#'+p.invoice.id : 'Legacy payment'}"></td><td class="money"><span th:text="${'$'+p.totalAmount}"></span><p class="small" th:if="${p.refundedAmount.signum()>0}" th:text="${'$'+p.refundedAmount+' refunded'}"></p></td><td th:text="${p.paymentMethod}"></td><td><span class="badge" th:text="${#strings.replace(p.status,'_',' ')}"></span></td><td><a th:if="${p.paidAt != null}" th:href="@{/receipts/{id}(id=${p.id})}">View receipt</a></td></tr></tbody></table><p class="empty" th:if="${#lists.isEmpty(payments)}">No payments recorded.</p></div></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
