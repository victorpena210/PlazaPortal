<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Maintenance.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>Maintenance.</h1><p class="muted">Keep tenants informed as requests move toward completion.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><p class="card muted" th:if="${#lists.isEmpty(requests)}">No maintenance requests yet.</p><section class="card request" th:each="r:${requests}"><div class="actions"><span class="badge" th:text="${#strings.replace(r.status,'_',' ')}"></span><span class="small muted" th:text="${r.office.property.name+' · Unit '+r.office.officeNumber}"></span></div><h2 th:text="${r.title}"></h2><p th:text="${r.description}"></p><div class="photo-row"><a th:each="photo:${photos.findByRequestIdOrderById(r.id)}" th:href="@{/maintenance-photos/{id}(id=${photo.id})}" target="_blank" rel="noopener"><img th:src="@{/maintenance-photos/{id}(id=${photo.id})}" alt="Maintenance request photo" loading="lazy"></a></div><p th:if="${r.tenantComment != null}"><strong>Tenant update: </strong><span th:text="${r.tenantComment}"></span></p><p th:if="${r.adminNote != null}"><strong>Manager update: </strong><span th:text="${r.adminNote}"></span></p><p class="small muted"><span th:text="${r.user.firstName+' '+r.user.lastName}"></span> · Priority: <span th:text="${r.priority}"></span></p><form th:action="@{/admin/maintenance/{id}/status(id=${r.id})}" method="post"><div class="form-grid"><div><label>Status</label><select name="status"><option value="OPEN" th:selected="${r.status.name()=='OPEN'}">Open</option><option value="IN_PROGRESS" th:selected="${r.status.name()=='IN_PROGRESS'}">In progress</option><option value="COMPLETED" th:selected="${r.status.name()=='COMPLETED'}">Completed</option></select></div><div><label>Update visible to tenant</label><textarea name="note" maxlength="5000" th:text="${r.adminNote}"></textarea></div></div><div class="actions"><button>Save & notify tenant</button></div></form></section></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
