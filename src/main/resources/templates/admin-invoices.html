<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Billing.')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">PLAZAPORTAL</p><h1>Billing.</h1><p class="muted">Review balances, record payments, and add agreed charges.</p></div><div th:replace="~{fragments/layout :: alerts}"></div><div class="actions"><form th:action="@{/admin/invoices/generate}" method="post"><button class="secondary">Generate missing rent invoices</button></form></div><details class="card"><summary>Add a deposit or other charge</summary><form th:action="@{/admin/invoices/charge}" method="post"><label>Lease</label><select name="leaseId" required><option th:each="l:${leases}" th:value="${l.id}" th:text="${l.tenantName+' · '+l.office.property.name+' / '+l.office.officeNumber}"></option></select><div class="form-grid"><div><label>Description</label><input name="description" maxlength="255" placeholder="Security deposit, utilities, or other agreed charge" required></div><div><label>Amount ($)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Due date</label><input name="dueDate" type="date" required></div></div><div class="actions"><button>Add charge</button></div></form></details><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Tenant / unit</th><th>Due</th><th>Total / balance</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="i:${invoices}"><td>#<span th:text="${i.id}"></span><br><span th:text="${i.description}"></span></td><td><span th:text="${i.lease.tenantName}"></span><br><span th:text="${i.lease.office.property.name+' / '+i.lease.office.officeNumber}"></span></td><td th:text="${i.dueDate}"></td><td class="money"><span th:text="${'$'+i.total}"></span><br><strong th:text="${'$'+billing.balance(i)+' remaining'}"></strong></td><td><span class="badge" th:text="${#strings.replace(i.status,'_',' ')}"></span></td><td><details th:if="${billing.balance(i).signum()>0}"><summary>Record offline payment</summary><form th:action="@{/admin/invoices/{id}/offline(id=${i.id})}" method="post"><input type="hidden" name="key" th:value="${formKey}"><label>Amount received ($)</label><input name="amount" type="number" min="0.01" step="0.01" th:max="${billing.balance(i)}" required><label>Method</label><select name="method"><option value="CHECK">Check</option><option value="CASH">Cash</option><option value="BANK_TRANSFER">Bank transfer</option><option value="OTHER">Other</option></select><label>Reference / receipt number</label><input name="reference" maxlength="255" required><label>Record note</label><input name="note" maxlength="500" required><div class="actions"><button>Record received payment</button></div></form></details><details th:if="${i.status.name()!='VOID' and billing.paid(i).signum()==0}"><summary>Void invoice</summary><form th:action="@{/admin/invoices/{id}/void(id=${i.id})}" method="post"><label>Reason</label><input name="reason" maxlength="500" required><div class="actions"><button class="danger">Void invoice</button></div></form></details></td></tr></tbody></table><p class="empty" th:if="${#lists.isEmpty(invoices)}">No invoices yet.</p></div></main><footer>PlazaPortal · A place for everything that keeps your property running.</footer></body></html>
