<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title + ' · PlazaPortal'}">PlazaPortal</title><link rel="stylesheet" th:href="@{/css/portal.css}"></head><body>
<header th:fragment="nav"><div class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">P</span> PlazaPortal</a><div th:if="${currentUser != null}" class="account"><span th:text="${currentUser.firstName}"></span><form th:action="@{/logout}" method="post"><button class="quiet" type="submit">Sign out</button></form></div><a th:if="${currentUser == null}" th:href="@{/login}">Sign in</a></div><div th:if="${currentUser != null}" class="nav-wrap"><nav aria-label="Main navigation"><a th:if="${memberships != null and !#lists.isEmpty(memberships)}" th:href="@{/admin/dashboard}">Overview</a><a th:if="${memberships != null and !#lists.isEmpty(memberships)}" th:href="@{/admin/properties}">Properties</a><a th:if="${memberships != null and !#lists.isEmpty(memberships)}" th:href="@{/admin/leases}">Leases</a><a th:if="${memberships != null and !#lists.isEmpty(memberships)}" th:href="@{/admin/invoices}">Billing</a><a th:if="${memberships != null and !#lists.isEmpty(memberships)}" th:href="@{/admin/payments}">Payments</a><a th:if="${memberships != null and !#lists.isEmpty(memberships)}" th:href="@{/admin/maintenance}">Maintenance</a><a th:if="${companyOwner == true}" th:href="@{/admin/company}">Company</a><a th:href="@{/tenant/dashboard}">My tenant account</a></nav><form th:if="${memberships != null and !#lists.isEmpty(memberships)}" th:action="@{/companies/switch}" method="post" class="switch"><label class="sr-only" for="company-switch">Company</label><select id="company-switch" name="companyId"><option th:each="m:${memberships}" th:value="${m.company.id}" th:text="${m.company.name}" th:selected="${selectedCompany != null and m.company.id == selectedCompany.id}"></option></select><button class="secondary">Switch</button></form></div></header>
<div th:fragment="alerts"><p class="alert success" th:if="${successMessage != null}" th:text="${successMessage}" role="status"></p><p class="alert error" th:if="${errorMessage != null}" th:text="${errorMessage}" role="alert"></p></div></body></html>
